########################################################################
# 12-factor config: every value below is overridable by environment.
# Nothing sensitive has a real default committed here.
########################################################################

server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: settlement-service
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true          # blocking JDBC + a sleepy downstream: virtual threads keep this cheap
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/settlement}
    username: ${DATABASE_USERNAME:settlement}
    password: ${DATABASE_PASSWORD:settlement}
    hikari:
      # The capture path serializes on a per-payment row lock while holding a
      # connection, so the pool must comfortably exceed expected capture
      # concurrency or requests queue on the pool instead of the lock.
      maximum-pool-size: ${DB_POOL_MAX:24}
      minimum-idle: ${DB_POOL_MIN:2}
      # Generous by default because serverless Postgres (Neon, Supabase) suspends
      # its compute when idle and takes a moment to wake. A tight timeout here
      # turns a normal cold start into a failed request.
      connection-timeout: ${DB_CONNECTION_TIMEOUT:20000}
      # Hikari fails fast on startup by default. With a suspended database that
      # means the process dies before the compute has finished waking, and the
      # platform restarts it into the same race. Retry for a while instead.
      initialization-fail-timeout: ${DB_INIT_FAIL_TIMEOUT:60000}
      max-lifetime: 900000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      # Money is integer minor units. An amount of 12.34 is a caller error and
      # must be rejected, never quietly truncated to 12.
      accept-float-as-int: false

app:
  # Identifies this instance in logs and in outbox lease ownership.
  instance-id: ${INSTANCE_ID:}
  settlement:
    # The drainer talks to the downstream over real HTTP, so timeouts and
    # retries are exercised for real. Points at this app's own /mock-settlement
    # by default; override to aim at a different provider.
    # {port} is substituted with the port actually bound at startup, which is
    # what makes this correct on hosts that assign the port dynamically.
    downstream-url: ${SETTLEMENT_DOWNSTREAM_URL:http://127.0.0.1:{port}/mock-settlement}
    request-timeout: ${SETTLEMENT_REQUEST_TIMEOUT:3s}
    # With a downstream that fails ~40% of the time, 10 attempts leaves a
    # ~1-in-10,000 chance of an item dead-lettering purely from bad luck, which
    # keeps the dead-letter queue meaningful: an item in it is a real problem,
    # not statistical noise.
    max-attempts: ${SETTLEMENT_MAX_ATTEMPTS:10}
    backoff-base: ${SETTLEMENT_BACKOFF_BASE:250ms}
    backoff-max: ${SETTLEMENT_BACKOFF_MAX:10s}
    # How long a claimed item stays leased before the reaper assumes the owner
    # died. Must exceed request-timeout by a healthy margin.
    lease-duration: ${SETTLEMENT_LEASE_DURATION:30s}
    batch-size: ${SETTLEMENT_BATCH_SIZE:50}
    # Concurrent in-flight settlement calls within one drain pass.
    concurrency: ${SETTLEMENT_CONCURRENCY:16}
  drain:
    # The self-driving tick. /admin/drain triggers the same code path.
    enabled: ${DRAIN_TICK_ENABLED:true}
    interval: ${DRAIN_TICK_INTERVAL:2s}
  mock-downstream:
    failure-rate: ${MOCK_FAILURE_RATE:0.4}
    min-latency: ${MOCK_MIN_LATENCY:100ms}
    max-latency: ${MOCK_MAX_LATENCY:500ms}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # p99 must be a real quantile computed from a histogram, not something
      # extrapolated from a mean, or it will lie exactly when it matters.
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      slo:
        http.server.requests: 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s
  observations:
    key-values:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

  # Push the same registry to an OTLP endpoint. OFF unless OTLP_ENABLED=true, so
  # nothing here changes behaviour until it is deliberately switched on — with
  # it off there is no exporter thread and no outbound connection attempt.
  #
  # This exists because a platform that gives you a public URL but no inbound
  # scraper cannot be pulled from. /metrics remains the source of truth; this
  # ships the same numbers outward on a timer.
  #
  # For Grafana Cloud: OTLP_URL is the OTLP gateway for your stack's region with
  # /v1/metrics on the end, and OTLP_AUTH is "Basic " + base64(instanceId:token).
  # Both come from the OTLP integration page of your Grafana Cloud stack.
  otlp:
    metrics:
      export:
        enabled: ${OTLP_ENABLED:false}
        url: ${OTLP_URL:http://localhost:4318/v1/metrics}
        step: ${OTLP_STEP:60s}
        headers:
          Authorization: ${OTLP_AUTH:}
        resource-attributes:
          service.name: ${spring.application.name}
          service.instance.id: ${INSTANCE_ID:local}
          deployment.environment: ${DEPLOY_ENV:local}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.settlement: ${LOG_LEVEL_APP:INFO}
    org.springframework.jdbc.core: ${LOG_LEVEL_SQL:INFO}
